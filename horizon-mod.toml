id = "legacy"
name = "Legacy4J"
version = "0.1.0"
description = "Adapts the interface of Minecraft Legacy Console Edition to Horizon."
authors = ["Legacy4J authors", "Legacy Horizon port"]
api = "0.2"
side = "both"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "graceful_quit"
target = "horizon_client::game::window_handler::Game<'_>::idle"
kind = "HEAD"
helper = "src/mixins/quit.rs"
bindings = [{ name = "event_loop", ty = "&dyn EventLoopCtl", value = "event_loop" }]

[[native.mixin]]
id = "console_controller_movement"
target = "horizon_client::game::pad::Game<'_>::pad_move"
kind = "OVERWRITE"
helper = "src/mixins/controller_move.rs"
bindings = [{ name = "game", ty = "&Game<'_>", value = "&*self" }]

[[native.mixin]]
id = "console_controller_input"
target = "horizon_client_input::input::modify_input"
kind = "OVERWRITE"
helper = "src/mixins/controller_input.rs"
bindings = [{ name = "input", ty = "[f32; 2]", value = "input" }, { name = "item_use", ty = "Option<f32>", value = "item_use" }, { name = "sneaking", ty = "Option<f32>", value = "sneaking" }]

[[native.mixin]]
id = "console_controller_camera"
target = "horizon_client::game::pad::Game<'_>::pad_look"
kind = "OVERWRITE"
helper = "src/mixins/controller_look.rs"
bindings = [{ name = "game", ty = "&mut Game<'_>", value = "self" }, { name = "seconds", ty = "f32", value = "seconds" }]

[[native.mixin]]
id = "console_controller_menu_buttons"
target = "horizon_client::game::pad_menu::Game<'_>::pad_menu_button"
kind = "HEAD"
cancellable = true
helper = "src/mixins/controller_menu.rs"
bindings = [{ name = "game", ty = "&Game<'_>", value = "&*self" }, { name = "button", ty = "Button", value = "button" }, { name = "down", ty = "bool", value = "down" }]

[[native.mixin]]
id = "console_controller_menu_stick"
target = "horizon_client::game::pad_menu::Game<'_>::pad_step"
kind = "HEAD"
cancellable = true
helper = "src/mixins/controller_menu_step.rs"
bindings = [{ name = "game", ty = "&Game<'_>", value = "&*self" }, { name = "button", ty = "Button", value = "button" }]

